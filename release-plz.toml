[workspace]
# Each library keeps its own version, changelog, tag (`<crate>-v<version>`) and GitHub
# release: an app takes the widgets it uses, and a break in one must not bump another.
changelog_update = true
dependencies_update = true
publish = true
release = true
git_release_enable = true
git_tag_enable = true
# Publish only when a release PR is merged, not on every push to main that carries an
# unpublished version.
release_always = false
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]

[[package]]
name = "alumina-datetime"
changelog_path = "crates/alumina-datetime/CHANGELOG.md"

[[package]]
name = "alumina-code"
changelog_path = "crates/alumina-code/CHANGELOG.md"

[[package]]
name = "alumina-markdown"
changelog_path = "crates/alumina-markdown/CHANGELOG.md"

# The demo app is never released: `publish = false` in its Cargo.toml keeps release-plz off it.
