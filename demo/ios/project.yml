# The demo's iOS app, for XcodeGen (`xcodegen generate` here writes AluminaDemo.xcodeproj).
# The app is a shell around the Rust staticlib: main.m hands the main thread to
# `alumina_demo_main`, which runs eframe's event loop through corundum's window.
# build-rust.sh builds the staticlib for the SDK Xcode targets before each build.
name: AluminaDemo
options:
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  AluminaDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # On the target as well: bundleIdPrefix is not used, since it writes
    # PRODUCT_BUNDLE_IDENTIFIER into the target and would override the xcconfig.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - Sources
      # The app icon: build-rust.sh's cargo build renders AppIcon.png into it (build.rs).
      - Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        LIBRARY_SEARCH_PATHS: "$(BUILT_PRODUCTS_DIR)/rust"
        OTHER_LDFLAGS: "-lalumina_demo"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # arm64 simulator binaries must be at least ad-hoc signed to launch.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Alumina Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # A scene, which iOS 27 requires of an app built with its SDK. corundum's window
        # puts winit's in it (corundum_framework_gui::window::IOS_SCENE_DELEGATE).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: CorundumSceneDelegate
    preBuildScripts:
      - name: Build the Rust staticlib
        script: ./build-rust.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/rust/libalumina_demo.a
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreFoundation.framework
schemes:
  AluminaDemo:
    build:
      targets:
        AluminaDemo: all
    run:
      config: Debug
    archive:
      config: Release
