[package]
name = "alumina-demo"
version = "0.0.0"
description = "A desktop app for trying alumina's widgets"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The lib holds the app, so the tests reach it; the binary opens its window.
[lib]
name = "alumina_demo"

[[bin]]
name = "alumina-demo"
path = "src/main.rs"

[dependencies]
alumina-code = { workspace = true }
alumina-datetime = { workspace = true }
alumina-markdown = { workspace = true }
# The window, on the egui the widgets use. Its default `system_fonts` finds a system font
# for the Japanese labels, which egui's own fonts lack.
eframe = "0.37"
# The Rust highlighter: syntect's bundled syntaxes, with the pure-Rust regex engine.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }


# build.rs: the icon, from assets/app-icon.svg alone (no PNG in the repository).
[build-dependencies]
# Embeds the icon in the Windows executable. The only corundum crate here, and only at
# build time: nothing of it is linked into the demo.
corundum-framework-build = "0.11.0"
# Renders the window's icon. The version corundum-framework-build renders with.
resvg = { version = "0.49", default-features = false }
