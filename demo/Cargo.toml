[package]
name = "alumina-demo"
version = "0.0.0"
description = "A desktop app for trying alumina's widgets"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The lib holds the app, so the tests reach it; the binary opens its window.
[lib]
name = "alumina_demo"

[[bin]]
name = "alumina-demo"
path = "src/main.rs"

[dependencies]
alumina-code = { workspace = true }
alumina-datetime = { workspace = true }
alumina-markdown = { workspace = true }
# The window is corundum's, as in the apps: it finds a CJK font for the Japanese labels.
corundum-framework-gui = { version = "0.7.0", default-features = false, features = ["eframe"] }
# `LauncherSpec`, which gives the window its icon (and the app its entry in the app menu);
# the version corundum-framework-gui is built with.
corundum-framework-platform = "0.7.0"
# The Rust highlighter: syntect's bundled syntaxes, with the pure-Rust regex engine.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

# build.rs: embeds assets/app-icon.svg as the icon of the Windows executable.
[build-dependencies]
corundum-framework-build = "0.8.0"
