[package]
name = "alumina-datetime"
version = "0.2.0"
description = "egui widgets for picking dates, periods, times and timestamps: a calendar, time drums and picker buttons"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["egui", "calendar", "date-picker", "time-picker", "gui"]
categories = ["gui", "date-and-time"]

[dependencies]
chrono = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
# egui's own fonts, for the tests' windows, which have no system's.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
egui_extras = { version = "0.37", features = ["svg"] }
