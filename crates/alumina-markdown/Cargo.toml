[package]
name = "alumina-markdown"
version = "0.1.0"
description = "A Markdown editor for egui that formats as you type"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["egui", "markdown", "editor", "wysiwyg", "gui"]
categories = ["gui", "text-editors"]

[dependencies]
egui = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
# egui's own fonts, for the tests' windows, which have no system's.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
egui_extras = { version = "0.37", features = ["svg"] }
