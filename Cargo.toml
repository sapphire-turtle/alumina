[workspace]
resolver = "3"
members = ["crates/alumina-datetime", "crates/alumina-demo", "crates/alumina-markdown"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/alumina"
edition = "2024"

[workspace.dependencies]
alumina-datetime = { path = "crates/alumina-datetime" }
alumina-markdown = { path = "crates/alumina-markdown" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = "0.37"
eframe = "0.37"
