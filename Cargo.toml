[workspace]
resolver = "3"
members = ["crates/alumina-datetime", "crates/alumina-demo", "crates/alumina-markdown"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/alumina"
edition = "2024"

[workspace.dependencies]
alumina-datetime = { version = "0.1.0", path = "crates/alumina-datetime" }
alumina-markdown = { version = "0.1.0", path = "crates/alumina-markdown" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui = "0.37"
tracing = "0.1"
tracing-subscriber = "0.3"

# android-activity 0.6 makes a slice of GameActivity's text before any text is set, from a
# null pointer; a debug build's precondition check aborts there on the window's first frame
# (corundum-framework-gui's `window::run_android`). Without debug assertions in that crate
# alone the empty slice is read as empty, as in a release build.
[profile.dev.package.android-activity]
debug-assertions = false
