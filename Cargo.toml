[workspace]
resolver = "3"
members = ["crates/alumina-code", "crates/alumina-datetime", "demo", "crates/alumina-markdown"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/alumina"
edition = "2024"

[workspace.dependencies]
alumina-code = { version = "0.1.0", path = "crates/alumina-code" }
alumina-datetime = { version = "0.2.0", path = "crates/alumina-datetime" }
alumina-markdown = { version = "0.2.0", path = "crates/alumina-markdown" }
egui = "0.37"
jiff = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

